name: CI build

on:
  workflow_dispatch:
    inputs:
      build_windows_debug:
        description: "Build Windows Debug"
        type: boolean
        default: false
      build_windows_release:
        description: "Build Windows Release"
        type: boolean
        default: false
      build_android_release:
        description: "Build Android Release"
        type: boolean
        default: false
      build_switch_release:
        description: "Build Nintendo Switch Release"
        type: boolean
        default: false
      build_linux_release:
        description: "Build Linux Release"
        type: boolean
        default: false

env:
  VCPKG_BINARY_SOURCES: clear

jobs:
  build-switch:
    if: inputs.build_switch_release
    name: Build for Nintendo Switch
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: insaniquarium

      - uses: actions/checkout@v6
        with:
          repository: kyle-sylvestre/WinFish
          path: src/WinFish
          ref: develop

      - name: Create flat SexyAppFramework
        shell: bash
        run: |
          bash scripts/create_flat_directory.sh

      - name: Compile libopenmpt for Switch
        shell: bash
        run: |
          dkp-pacman -S --needed --noconfirm switch-sdl2 switch-libogg switch-libvorbis switch-mpg123 switch-libpng switch-libjpeg-turbo switch-zlib switch-cmake
          dkp-pacman -R --noconfirm switch-sdl2_mixer switch-mpg123 # fix linker error
          source $DEVKITPRO/switchvars.sh
          export PKG_CONFIG_SYSROOT_DIR=
          export PKG_CONFIG_LIBDIR=$DEVKITPRO/portlibs/switch/lib/pkgconfig
          git clone https://github.com/OpenMPT/openmpt
          cd openmpt
          make CONFIG=gcc SHARED_LIB=0 DYNLINK=0 EXAMPLES=0 OPENMPT123=0 TEST=0 PREFIX=$PORTLIBS_PREFIX install 

      - name: Compile Insaniquarium-Portable for Switch
        shell: bash
        run: |
          source $DEVKITPRO/switchvars.sh
          export PKG_CONFIG_SYSROOT_DIR=
          export PKG_CONFIG_LIBDIR=$DEVKITPRO/portlibs/switch/lib/pkgconfig
          mkdir build
          cd build
          aarch64-none-elf-cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS_RELEASE=-O2
          make
          aarch64-none-elf-strip insaniquarium-portable.elf

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: insaniquarium-portable-switch
          path: |
            ./build/insaniquarium-portable.nro
            ./build/insaniquarium-portable.elf

  build-windows-msvc-x86-release:
    if: inputs.build_windows_release
    name: Build for Windows (Release MSVC x86)
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        ref: insaniquarium

    - uses: actions/checkout@v6
      with:
        repository: kyle-sylvestre/WinFish
        path: src/WinFish
        ref: develop

    - name: Create flat SexyAppFramework
      shell: bash
      run: |
        bash scripts/create_flat_directory.sh

    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Install Ninja
      run: choco install ninja -y

      # Use old cmake for building YASM
      # build error: Compatibility with CMake < 3.5 has been removed from CMake.
    - name: Setup CMake 3.31.9
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.31.9'

    - name: Setup vcpkg (manifest mode)
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: vcpkg.json

    - name: Compile Insaniquarium-Portable for Windows (MSVC)
      shell: pwsh
      run: |
        cmake -G "Ninja" -B build -DCMAKE_BUILD_TYPE=Release -DCONSOLE=OFF -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x86-windows-static
        cmake --build build

        New-Item -ItemType Directory -Force -Path dist | Out-Null
        New-Item -ItemType Directory -Force -Path dist/insaniquarium-portable | Out-Null
        Copy-Item build/insaniquarium-portable.exe dist/insaniquarium-portable
        Copy-Item zuma/LICENSE.txt dist/insaniquarium-portable

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: insaniquarium-portable-windows-msvc-x86-release
        path: dist/


  build-windows-msvc-x86-debug:
    if: inputs.build_windows_debug
    name: Build for Windows (Debug MSVC x86)
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        ref: insaniquarium

    - uses: actions/checkout@v6
      with:
        repository: kyle-sylvestre/WinFish
        path: src/WinFish
        ref: develop

    - name: Create flat SexyAppFramework
      shell: bash
      run: |
        bash scripts/create_flat_directory.sh

    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Install Ninja
      run: choco install ninja -y

      # Use old cmake for building YASM
      # build error: Compatibility with CMake < 3.5 has been removed from CMake.
    - name: Setup CMake 3.31.9
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.31.9'

    - name: Setup vcpkg (manifest mode)
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: vcpkg.json

    - name: Compile Insaniquarium-Portable for Windows (MSVC)
      shell: pwsh
      run: |
        cmake -G "Ninja" -B build -DCMAKE_BUILD_TYPE=Debug -DCONSOLE=OFF -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x86-windows-static
        cmake --build build

        New-Item -ItemType Directory -Force -Path dist | Out-Null
        New-Item -ItemType Directory -Force -Path dist/insaniquarium-portable | Out-Null
        Copy-Item build/insaniquarium-portable.exe dist/insaniquarium-portable
        Copy-Item build/insaniquarium-portable.pdb dist/insaniquarium-portable
        Copy-Item zuma/LICENSE.txt dist/insaniquarium-portable

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: insaniquarium-portable-windows-msvc-x86-debug
        path: dist/
  build-android:
    if: inputs.build_android_release
    name: Build for Android (arm64-v8a and armeabi-v7a)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        ref: insaniquarium

    - uses: actions/checkout@v6
      with:
        repository: kyle-sylvestre/WinFish
        path: src/WinFish
        ref: develop

    - name: Create flat SexyAppFramework
      shell: bash
      run: |
        bash scripts/create_flat_directory.sh

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools'

    - name: Install Android NDK
      run: |
        # Use the latest NDK available on the runner
        if [ -n "$ANDROID_NDK_LATEST_HOME" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
          echo "ANDROID_NDK=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "Using pre-installed NDK: $ANDROID_NDK_LATEST_HOME"
        else
          # Fallback: install via sdkmanager
          yes | sdkmanager --install "ndk;$(sdkmanager --list 2>/dev/null | grep -oP 'ndk;\K[\d.]+' | sort -V | tail -1)" || true
          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/*/ 2>/dev/null | sort -V | tail -1)
          echo "ANDROID_NDK=${NDK_DIR%/}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${NDK_DIR%/}" >> "$GITHUB_ENV"
        fi

    - name: Download SDL2 Source
      run: |
        wget -q "https://github.com/libsdl-org/SDL/archive/refs/heads/SDL2.tar.gz"
        tar xf "SDL2.tar.gz"
        mv "SDL-SDL2" sdl2-src

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: vcpkg.json

    - name: Build SDL2 Shared Library
      run: |
        # On Android, SDL2 MUST be a shared library because the Java-side
        # SDLActivity loads it via System.loadLibrary("SDL2").
        for ABI in arm64-v8a armeabi-v7a; do
          BUILD_DIR=build-sdl2-$ABI
          INSTALL_PREFIX=$GITHUB_WORKSPACE/sdl2-android/$ABI

          cmake -B $BUILD_DIR \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=$ABI \
            -DANDROID_PLATFORM=android-21 \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF \
            -DCMAKE_INSTALL_PREFIX=$INSTALL_PREFIX \
            -DCMAKE_BUILD_TYPE=Release \
            sdl2-src

          cmake --build $BUILD_DIR -j$(nproc)
          cmake --install $BUILD_DIR
        done

    - name: Build Native Library with CMake
      run: |
        for ABI in arm64-v8a armeabi-v7a; do
          ANDROID_API=21
          BUILD_DIR=build-android-$ABI
          SDL2_PREFIX=$GITHUB_WORKSPACE/sdl2-android

          if [ "$ABI" = "arm64-v8a" ]; then
            TRIPLET=arm64-android
          else
            TRIPLET=arm-neon-android
          fi

          cmake -B $BUILD_DIR \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=$TRIPLET \
            -DVCPKG_CMAKE_SYSTEM_VERSION=$ANDROID_API \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=$ABI \
            -DANDROID_PLATFORM=android-$ANDROID_API \
            -DSDL2_DIR=$SDL2_PREFIX/$ABI/lib/cmake/SDL2 \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build $BUILD_DIR -j$(nproc)

          # Collect all shared libraries into jniLibs for Gradle to package
          JNILIBS=android/app/src/main/jniLibs/$ABI
          mkdir -p $JNILIBS
          cp -L $BUILD_DIR/libmain.so $JNILIBS/

          # Copy SDL2 shared library
          cp -L $SDL2_PREFIX/$ABI/lib/libSDL2*.so $JNILIBS/

          # Copy any .so dependencies from vcpkg (manifest mode installs into build dir)
          echo "vcpkg_installed files:"
          ls $BUILD_DIR/vcpkg_installed
          VCPKG_LIB=$BUILD_DIR/vcpkg_installed/$TRIPLET/lib
          for so in "$VCPKG_LIB"/*.so; do
            [ -f "$so" ] && cp -L "$so" $JNILIBS/
          done

          # Strip debug symbols to reduce APK size
          STRIP=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip
          for so in "$JNILIBS"/*.so; do
            "$STRIP" --strip-unneeded "$so"
          done

          echo "Collected .so files:"
          ls -lh $JNILIBS/
        done

    - name: Build APK with Gradle
      run: |
        cd android
        echo "sdk.dir=$ANDROID_HOME" > local.properties

        # Use gradle wrapper; package pre-built native libraries into a release APK (debug-signed)
        gradle wrapper
        ./gradlew assembleRelease -PusePrebuiltLibs=true --no-daemon

    - name: Copy APK
      run: |
        mkdir -p dist
        find android -name "*.apk" -path "*/release/*" -exec cp {} dist/insaniquarium-portable-android.apk \;

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: insaniquarium-portable-android
        path: dist/

  build-linux-static:
    if: inputs.build_linux_release
    name: Build for Linux (${{ matrix.arch }}, static)
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            container: quay.io/pypa/manylinux_2_34_x86_64

          - arch: aarch64
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_34_aarch64

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        ref: insaniquarium

    - uses: actions/checkout@v6
      with:
        repository: kyle-sylvestre/WinFish
        path: src/WinFish
        ref: develop

    - name: Create flat SexyAppFramework
      shell: bash
      run: |
        bash scripts/create_flat_directory.sh

    - name: Fix Git Safe Directory
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Install Dependencies
      run: |
        dnf install -y \
          alsa-lib-devel \
          libdecor-devel \
          libXcursor-devel \
          libXext-devel \
          libXi-devel \
          libXrandr-devel \
          libXScrnSaver-devel \
          libxkbcommon-devel \
          mesa-libGL-devel \
          nasm \
          ninja-build \
          pipewire-devel \
          pkgconf-pkg-config \
          pulseaudio-libs-devel \
          wayland-devel \
          wget

    - name: Resolve Dep Versions
      run: |
        SDL2_TAG=$(git ls-remote --tags https://github.com/libsdl-org/SDL.git 'refs/tags/release-2.*' \
          | sed 's|.*refs/tags/release-||' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
        if [ -z "$SDL2_TAG" ]; then
          SDL2_TAG="2.32.10" # Fallback to a known stable version if tag retrieval fails
        fi
        echo "SDL2_TAG=$SDL2_TAG" >> "$GITHUB_ENV"

        OPENMPT_TAG=$(git ls-remote --tags https://github.com/OpenMPT/openmpt.git 'refs/tags/libopenmpt-*' \
          | sed 's|.*refs/tags/libopenmpt-||' \
          | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
        if [ -z "$OPENMPT_TAG" ]; then
          OPENMPT_TAG="0.8.4" # Fallback to a known stable version if tag retrieval fails
        fi
        echo "OPENMPT_TAG=$OPENMPT_TAG" >> "$GITHUB_ENV"

        LIBPNG_VERSION=$(git ls-remote --tags https://github.com/pnggroup/libpng.git 'refs/tags/v1.6.*' \
          | sed 's|.*refs/tags/v||' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
        if [ -z "$LIBPNG_VERSION" ]; then
          LIBPNG_VERSION="1.6.58" # Fallback to a known stable version if tag retrieval fails
        fi
        echo "LIBPNG_VERSION=$LIBPNG_VERSION" >> "$GITHUB_ENV"

        JPEG_TURBO_VERSION=$(git ls-remote --tags https://github.com/libjpeg-turbo/libjpeg-turbo.git 'refs/tags/[0-9]*' \
          | sed 's|.*refs/tags/||' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
        if [ -z "$JPEG_TURBO_VERSION" ]; then
          JPEG_TURBO_VERSION="3.1.3" # Fallback to a known stable version if tag retrieval fails
        fi
        echo "JPEG_TURBO_VERSION=$JPEG_TURBO_VERSION" >> "$GITHUB_ENV"

        echo "Using SDL2 $SDL2_TAG, libopenmpt $OPENMPT_TAG,"
        echo "libpng $LIBPNG_VERSION, libjpeg-turbo $JPEG_TURBO_VERSION"

    - name: Build SDL2 (static)
      if: steps.deps-cache.outputs.cache-hit != 'true'
      run: |
        wget -q "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_TAG}/SDL2-${SDL2_TAG}.tar.gz"
        tar xf "SDL2-${SDL2_TAG}.tar.gz"
        # Use SDL's built-in iconv for wider glibc compatibility, including glibc installs without iconv
        cmake -G Ninja -B build-sdl2 \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="$HOME/pvz-deps" \
          -DSDL_SHARED=OFF \
          -DSDL_STATIC=ON \
          -DSDL_TEST=OFF \
          -DSDL_KMSDRM=OFF \
          -DSDL_JACK=OFF \
          -DSDL_SNDIO=OFF \
          -DSDL_DBUS=OFF \
          -DSDL_IBUS=OFF \
          -DSDL_LIBUDEV=OFF \
          -DSDL_LIBSAMPLERATE=OFF \
          -DSDL_SYSTEM_ICONV=OFF \
          "SDL2-${SDL2_TAG}"
        cmake --build build-sdl2 -j$(nproc)
        cmake --install build-sdl2

    - name: Build zlib
      run: |
        git clone --depth=1 https://github.com/madler/zlib.git zlib-src
        cd zlib-src
        ./configure \
          --prefix="$HOME/pvz-deps" \
          --static
        make -j$(nproc)
        make install

    - name: Build Ogg
      run: |
        git clone --depth=1 https://github.com/xiph/ogg.git libogg-src
        cd libogg-src
        ./autogen.sh
        ./configure \
          --prefix="$HOME/pvz-deps" \
          --disable-shared \
          --enable-static
        make -j$(nproc)
        make install

    - name: Build Vorbis
      run: |
        git clone --depth=1 https://github.com/xiph/vorbis.git libvorbis-src
        cd libvorbis-src
        ./autogen.sh
        ./configure \
          --prefix="$HOME/pvz-deps" \
          --disable-shared \
          --enable-static \
          --with-ogg="$HOME/pvz-deps"
        make -j$(nproc)
        make install

    - name: Build mpg123
      run: |
        wget -q https://www.mpg123.de/download/mpg123-1.32.10.tar.bz2
        tar -xf mpg123-1.32.10.tar.bz2
        cd mpg123-1.32.10
        ./configure \
          --prefix="$HOME/pvz-deps" \
          --disable-shared \
          --enable-static
        make -j$(nproc)
        make install

    - name: Build libopenmpt (static)
      run: |
        git clone --depth=1 --branch "libopenmpt-${OPENMPT_TAG}" https://github.com/OpenMPT/openmpt.git libopenmpt-src
        cd libopenmpt-src
        make CONFIG=gcc \
          STATIC_LIB=1 SHARED_LIB=0 \
          EXAMPLES=0 OPENMPT123=0 TEST=0 \
          NO_ZLIB=1 NO_MPG123=1 NO_OGG=1 NO_VORBIS=1 NO_VORBISFILE=1 \
          NO_PORTAUDIO=1 NO_PORTAUDIOCPP=1 NO_PULSEAUDIO=1 \
          NO_SDL2=1 NO_FLAC=1 NO_SNDFILE=1 \
          -j$(nproc)
        make CONFIG=gcc \
          STATIC_LIB=1 SHARED_LIB=0 \
          EXAMPLES=0 OPENMPT123=0 TEST=0 \
          PREFIX="$HOME/pvz-deps" install

    - name: Build Codec Libraries (static)
      run: |
        git clone --depth=1 --branch "v${LIBPNG_VERSION}" https://github.com/pnggroup/libpng.git libpng-src
        cmake -G Ninja -B build-libpng libpng-src \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="$HOME/pvz-deps" \
          -DPNG_SHARED=OFF \
          -DPNG_STATIC=ON \
          -DPNG_EXECUTABLES=OFF \
          -DPNG_TESTS=OFF
        cmake --build build-libpng -j$(nproc)
        cmake --install build-libpng

        git clone --depth=1 --branch "${JPEG_TURBO_VERSION}" https://github.com/libjpeg-turbo/libjpeg-turbo.git libjpeg-turbo-src
        cmake -G Ninja -B build-jpeg libjpeg-turbo-src \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="$HOME/pvz-deps" \
          -DENABLE_SHARED=OFF \
          -DENABLE_STATIC=ON \
          -DWITH_TURBOJPEG=OFF
        cmake --build build-jpeg -j$(nproc)
        cmake --install build-jpeg

    - name: Build PvZ-Portable
      run: |
        find ~/pvz-deps | sort
        cmake -G Ninja -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_STATIC=ON \
          -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++" \
          -DCMAKE_PREFIX_PATH="$HOME/pvz-deps"
        cmake --build build

        mkdir -p dist
        strip build/insaniquarium-portable
        cp build/insaniquarium-portable dist/insaniquarium-portable-linux-${{ matrix.arch }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: insaniquarium-portable-linux-${{ matrix.arch }}
        path: dist/

