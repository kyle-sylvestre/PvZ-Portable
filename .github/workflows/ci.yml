name: CI build

on:
  workflow_dispatch:
    inputs:
      build_windows_debug:
        description: "Build Windows Debug"
        type: boolean
        default: false
      build_windows_release:
        description: "Build Windows Release"
        type: boolean
        default: false
      build_android_release:
        description: "Build Android Release"
        type: boolean
        default: false
      build_switch_release:
        description: "Build Nintendo Switch Release"
        type: boolean
        default: false

env:
  VCPKG_BINARY_SOURCES: clear

jobs:
  build-switch:
    if: inputs.build_switch_release
    name: Build for Nintendo Switch
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: zuma-switch

      - uses: actions/checkout@v6
        with:
          repository: 1timewire1/CircleShootApp
          path: src/CircleShoot
          ref: joystick

      - name: Create flat SexyAppFramework
        shell: bash
        run: |
          bash scripts/create_flat_directory.sh

      - name: Compile libopenmpt for Switch
        shell: bash
        run: |
          dkp-pacman -S --needed --noconfirm switch-sdl2 switch-libogg switch-libvorbis switch-mpg123 switch-libpng switch-libjpeg-turbo switch-zlib switch-cmake
          dkp-pacman -R --noconfirm switch-sdl2_mixer switch-mpg123 # fix linker error
          source $DEVKITPRO/switchvars.sh
          export PKG_CONFIG_SYSROOT_DIR=
          export PKG_CONFIG_LIBDIR=$DEVKITPRO/portlibs/switch/lib/pkgconfig
          git clone --depth 1 --branch libopenmpt-0.8.9 https://github.com/OpenMPT/openmpt
          cd openmpt
          make CONFIG=gcc CC=aarch64-none-elf-gcc CXX=aarch64-none-elf-g++ AR=aarch64-none-elf-ar \
            SHARED_LIB=0 STATIC_LIB=1 DYNLINK=0 EXAMPLES=0 OPENMPT123=0 TEST=0 NO_MPG123=1 \
            PREFIX=$PORTLIBS_PREFIX install

      - name: Compile Zuma-Portable for Switch
        shell: bash
        run: |
          source $DEVKITPRO/switchvars.sh
          export PKG_CONFIG_SYSROOT_DIR=
          export PKG_CONFIG_LIBDIR=$DEVKITPRO/portlibs/switch/lib/pkgconfig
          mkdir build
          cd build
          aarch64-none-elf-cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS_RELEASE=-O2
          make
          aarch64-none-elf-strip zuma-portable.elf

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: zuma-portable-switch
          path: |
            ./build/zuma-portable.nro
            ./build/zuma-portable.elf

  build-windows-msvc-x86-release:
    if: inputs.build_windows_release
    name: Build for Windows (Release MSVC x86)
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        ref: zuma

    - uses: actions/checkout@v6
      with:
        repository: kyle-sylvestre/CircleShootApp
        path: src/CircleShoot

    - name: Create flat SexyAppFramework
      shell: bash
      run: |
        bash scripts/create_flat_directory.sh

    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Install Ninja
      run: choco install ninja -y

      # Use old cmake for building YASM
      # build error: Compatibility with CMake < 3.5 has been removed from CMake.
    - name: Setup CMake 3.31.9
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.31.9'

    - name: Setup vcpkg (manifest mode)
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: vcpkg.json

    - name: Compile Zuma-Portable for Windows (MSVC)
      shell: pwsh
      run: |
        cmake -G "Ninja" -B build -DCMAKE_BUILD_TYPE=Release -DCONSOLE=OFF -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x86-windows-static
        cmake --build build

        New-Item -ItemType Directory -Force -Path dist | Out-Null
        New-Item -ItemType Directory -Force -Path dist/zuma-portable | Out-Null
        Copy-Item build/zuma-portable.exe dist/zuma-portable
        Copy-Item zuma/LICENSE.txt dist/zuma-portable

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: zuma-portable-windows-msvc-x86-release
        path: dist/


  build-windows-msvc-x86-debug:
    if: inputs.build_windows_debug
    name: Build for Windows (Debug MSVC x86)
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        ref: zuma

    - uses: actions/checkout@v6
      with:
        repository: kyle-sylvestre/CircleShootApp
        path: src/CircleShoot

    - name: Create flat SexyAppFramework
      shell: bash
      run: |
        bash scripts/create_flat_directory.sh

    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Install Ninja
      run: choco install ninja -y

      # Use old cmake for building YASM
      # build error: Compatibility with CMake < 3.5 has been removed from CMake.
    - name: Setup CMake 3.31.9
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.31.9'

    - name: Setup vcpkg (manifest mode)
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: vcpkg.json

    - name: Compile Zuma-Portable for Windows (MSVC)
      shell: pwsh
      run: |
        cmake -G "Ninja" -B build -DCMAKE_BUILD_TYPE=Debug -DCONSOLE=OFF -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x86-windows-static
        cmake --build build

        New-Item -ItemType Directory -Force -Path dist | Out-Null
        New-Item -ItemType Directory -Force -Path dist/zuma-portable | Out-Null
        Copy-Item build/zuma-portable.exe dist/zuma-portable
        Copy-Item build/zuma-portable.pdb dist/zuma-portable
        Copy-Item zuma/LICENSE.txt dist/zuma-portable

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: zuma-portable-windows-msvc-x86-debug
        path: dist/
  build-android:
    if: inputs.build_android_release
    name: Build for Android (arm64-v8a and armeabi-v7a)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        ref: zuma

    - uses: actions/checkout@v6
      with:
        repository: kyle-sylvestre/CircleShootApp
        path: src/CircleShoot

    - name: Create flat SexyAppFramework
      shell: bash
      run: |
        bash scripts/create_flat_directory.sh

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK
      run: |
        # Use the latest NDK available on the runner
        if [ -n "$ANDROID_NDK_LATEST_HOME" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
          echo "ANDROID_NDK=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "Using pre-installed NDK: $ANDROID_NDK_LATEST_HOME"
        else
          # Fallback: install via sdkmanager
          yes | sdkmanager --install "ndk;$(sdkmanager --list 2>/dev/null | grep -oP 'ndk;\K[\d.]+' | sort -V | tail -1)" || true
          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/*/ 2>/dev/null | sort -V | tail -1)
          echo "ANDROID_NDK=${NDK_DIR%/}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${NDK_DIR%/}" >> "$GITHUB_ENV"
        fi

    - name: Download SDL2 Source
      run: |
        wget -q "https://github.com/libsdl-org/SDL/archive/refs/heads/SDL2.tar.gz"
        tar xf "SDL2.tar.gz"
        mv "SDL-SDL2" sdl2-src

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: vcpkg.json

    - name: Build SDL2 Shared Library
      run: |
        # On Android, SDL2 MUST be a shared library because the Java-side
        # SDLActivity loads it via System.loadLibrary("SDL2").
        for ABI in arm64-v8a armeabi-v7a; do
          BUILD_DIR=build-sdl2-$ABI
          INSTALL_PREFIX=$GITHUB_WORKSPACE/sdl2-android/$ABI

          cmake -B $BUILD_DIR \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=$ABI \
            -DANDROID_PLATFORM=android-21 \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF \
            -DCMAKE_INSTALL_PREFIX=$INSTALL_PREFIX \
            -DCMAKE_BUILD_TYPE=Release \
            sdl2-src

          cmake --build $BUILD_DIR -j$(nproc)
          cmake --install $BUILD_DIR
        done

    - name: Build Native Library with CMake
      run: |
        for ABI in arm64-v8a armeabi-v7a; do
          ANDROID_API=21
          BUILD_DIR=build-android-$ABI
          SDL2_PREFIX=$GITHUB_WORKSPACE/sdl2-android

          if [ "$ABI" = "arm64-v8a" ]; then
            TRIPLET=arm64-android
          else
            TRIPLET=arm-neon-android
          fi

          cmake -B $BUILD_DIR \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=$TRIPLET \
            -DVCPKG_CMAKE_SYSTEM_VERSION=$ANDROID_API \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=$ABI \
            -DANDROID_PLATFORM=android-$ANDROID_API \
            -DSDL2_DIR=$SDL2_PREFIX/$ABI/lib/cmake/SDL2 \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build $BUILD_DIR -j$(nproc)

          # Collect all shared libraries into jniLibs for Gradle to package
          JNILIBS=android/app/src/main/jniLibs/$ABI
          mkdir -p $JNILIBS
          cp -L $BUILD_DIR/libmain.so $JNILIBS/

          # Copy SDL2 shared library
          cp -L $SDL2_PREFIX/$ABI/lib/libSDL2*.so $JNILIBS/

          # Copy any .so dependencies from vcpkg (manifest mode installs into build dir)
          echo "vcpkg_installed files:"
          ls $BUILD_DIR/vcpkg_installed
          VCPKG_LIB=$BUILD_DIR/vcpkg_installed/$TRIPLET/lib
          for so in "$VCPKG_LIB"/*.so; do
            [ -f "$so" ] && cp -L "$so" $JNILIBS/
          done

          # Strip debug symbols to reduce APK size
          STRIP=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip
          for so in "$JNILIBS"/*.so; do
            "$STRIP" --strip-unneeded "$so"
          done

          echo "Collected .so files:"
          ls -lh $JNILIBS/
        done

    - name: Build APK with Gradle
      run: |
        cd android
        echo "sdk.dir=$ANDROID_HOME" > local.properties

        # Use gradle wrapper; package pre-built native libraries into a release APK (debug-signed)
        gradle wrapper
        ./gradlew assembleRelease -PusePrebuiltLibs=true --no-daemon

    - name: Copy APK
      run: |
        mkdir -p dist
        find android -name "*.apk" -path "*/release/*" -exec cp {} dist/zuma-portable-android.apk \;

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: zuma-portable-android
        path: dist/

