name: CI build

on:
  workflow_dispatch:

jobs:
  build-windows-msvc-x86:
    name: Build for Windows (MSVC x86)
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        ref: zuma

    - uses: actions/checkout@v6
      with:
        repository: kyle-sylvestre/CircleShootApp
        path: src/CircleShoot

    - name: Create flat SexyAppFramework
      shell: bash
      run: |
        bash scripts/create_flat_directory.sh

    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Install Ninja
      run: choco install ninja -y

    - name: Setup vcpkg (manifest mode)
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: vcpkg.json

    - name: Compile Zuma-Portable for Windows (MSVC)
      shell: pwsh
      run: |
        cmake -G "Ninja" -B build -DCMAKE_BUILD_TYPE=Release -DCONSOLE=OFF -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x86-windows-static
        cmake --build build

        New-Item -ItemType Directory -Force -Path dist | Out-Null
        Copy-Item build/zuma-portable.exe dist/

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: zuma-portable-windows-msvc-x86
        path: dist/


